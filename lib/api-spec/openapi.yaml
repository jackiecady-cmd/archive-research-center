openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Archive & Research Center API
servers:
  - url: /api
    description: Base API path
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Email and password accounts
  - name: health
    description: Health operations
  - name: sources
    description: Archive source records
  - name: collections
    description: Curated research collections
  - name: researchProjects
    description: User research projects
  - name: savedSources
    description: Sources saved to projects
  - name: notes
    description: Research notes
  - name: claimCards
    description: Claim cards with evidence trails
  - name: evidence
    description: Evidence items
  - name: forum
    description: Research Commons forum
  - name: membership
    description: Membership and subscription
  - name: concierge
    description: Research Concierge onboarding
  - name: translations
    description: Translation workspace — layered linguistic analysis per source

paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      security: []
      tags: [auth]
      summary: Create an email and password account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created account and session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed-in account and session cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      security: []
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session cleared

  /auth/me:
    get:
      operationId: getCurrentUser
      security: []
      tags: [auth]
      summary: Return the signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not signed in

  # ─── Sources ─────────────────────────────────────────────────────────────────

  /sources:
    get:
      operationId: listSources
      security: []
      tags: [sources]
      summary: List and search archive sources
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: collection
          in: query
          schema: { type: string }
        - name: repository
          in: query
          schema: { type: string }
        - name: repositoryAccess
          in: query
          schema:
            type: string
            enum: [digitized, catalog_only, restricted, physical_access_required]
        - name: type
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: confidence
          in: query
          schema: { type: string }
        - name: availability
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
        - name: yearFrom
          in: query
          schema: { type: number }
        - name: yearTo
          in: query
          schema: { type: number }
      responses:
        "200":
          description: Paginated list of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
    post:
      operationId: createSource
      tags: [sources]
      summary: Create a new source record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /sources/{id}:
    get:
      operationId: getSource
      security: []
      tags: [sources]
      summary: Get a single source record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Source record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Not found
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update editable fields on a source record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceInput"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Not found

  /sources/stats:
    get:
      operationId: getSourceStats
      security: []
      tags: [sources]
      summary: Archive statistics overview
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveStats"

  # ─── Collections ─────────────────────────────────────────────────────────────

  /collections:
    get:
      operationId: listCollections
      security: []
      tags: [collections]
      summary: List all curated collections
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  /collections/{slug}:
    get:
      operationId: getCollection
      security: []
      tags: [collections]
      summary: Get a collection by slug with its sources
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found

  # ─── Repositories ────────────────────────────────────────────────────────────

  /repositories:
    get:
      operationId: listRepositories
      security: []
      tags: [repositories]
      summary: List holding repositories
      responses:
        "200":
          description: List of repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"

  /repositories/{slug}:
    get:
      operationId: getRepository
      security: []
      tags: [repositories]
      summary: Get a holding repository with its linked sources
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Repository detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryDetail"
        "404":
          description: Not found

  # ─── Research Projects ────────────────────────────────────────────────────────

  /research-projects:
    get:
      operationId: listResearchProjects
      tags: [researchProjects]
      summary: List all research projects for the current user
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchProject"
    post:
      operationId: createResearchProject
      tags: [researchProjects]
      summary: Create a new research project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchProject"

  /research-projects/{id}:
    get:
      operationId: getResearchProject
      tags: [researchProjects]
      summary: Get a research project with summary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchProjectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateResearchProject
      tags: [researchProjects]
      summary: Update a research project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchProject"
    delete:
      operationId: deleteResearchProject
      tags: [researchProjects]
      summary: Delete a research project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── Saved Sources ────────────────────────────────────────────────────────────

  /research-projects/{projectId}/saved-sources:
    get:
      operationId: listSavedSources
      tags: [savedSources]
      summary: List saved sources in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of saved sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSource"
    post:
      operationId: saveSource
      tags: [savedSources]
      summary: Save a source to a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSourceInput"
      responses:
        "201":
          description: Saved source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSource"

  /research-projects/{projectId}/saved-sources/{id}:
    delete:
      operationId: removeSavedSource
      tags: [savedSources]
      summary: Remove a saved source from a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Removed

  # ─── Notes ────────────────────────────────────────────────────────────────────

  /research-projects/{projectId}/notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /research-projects/{projectId}/notes/{id}:
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: number }
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── Claim Cards ──────────────────────────────────────────────────────────────

  /claim-cards:
    get:
      operationId: listClaimCards
      tags: [claimCards]
      summary: List claim cards, optionally filtered by project
      parameters:
        - name: projectId
          in: query
          schema: { type: number }
      responses:
        "200":
          description: List of claim cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClaimCard"
    post:
      operationId: createClaimCard
      tags: [claimCards]
      summary: Create a claim card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCardInput"
      responses:
        "201":
          description: Created claim card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCard"

  /claim-cards/{id}:
    get:
      operationId: getClaimCard
      tags: [claimCards]
      summary: Get a claim card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Claim card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCard"
    patch:
      operationId: updateClaimCard
      tags: [claimCards]
      summary: Update a claim card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimCardUpdate"
      responses:
        "200":
          description: Updated claim card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimCard"

  /claim-cards/{id}/evidence-trail:
    get:
      operationId: getEvidenceTrail
      tags: [claimCards]
      summary: Get the full evidence trail for a claim card
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Evidence trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceTrail"

  # ─── Evidence ─────────────────────────────────────────────────────────────────

  /claim-cards/{claimCardId}/evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List evidence for a claim card
      parameters:
        - name: claimCardId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of evidence items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: addEvidence
      tags: [evidence]
      summary: Add evidence to a claim card
      parameters:
        - name: claimCardId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Added evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  /claim-cards/{claimCardId}/evidence/{id}:
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      summary: Remove an evidence item
      parameters:
        - name: claimCardId
          in: path
          required: true
          schema: { type: number }
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  # ─── Forum ────────────────────────────────────────────────────────────────────

  /forum/threads:
    get:
      operationId: listForumThreads
      tags: [forum]
      summary: List forum threads
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumThread"
    post:
      operationId: createForumThread
      tags: [forum]
      summary: Create a forum thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumThreadInput"
      responses:
        "201":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThread"

  /forum/threads/{id}:
    get:
      operationId: getForumThread
      tags: [forum]
      summary: Get a forum thread with its replies
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Thread with replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadDetail"

  /forum/threads/{threadId}/replies:
    post:
      operationId: createForumReply
      tags: [forum]
      summary: Reply to a forum thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReplyInput"
      responses:
        "201":
          description: Created reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"

  /forum/recent:
    get:
      operationId: getRecentForumActivity
      tags: [forum]
      summary: Recent forum activity feed
      responses:
        "200":
          description: Recent threads and replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumActivity"

  # ─── Membership ───────────────────────────────────────────────────────────────

  /membership/plans:
    get:
      operationId: listMembershipPlans
      security: []
      tags: [membership]
      summary: List available membership plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipPlan"

  /membership/current:
    get:
      operationId: getCurrentMembership
      tags: [membership]
      summary: Get the current user membership
      responses:
        "200":
          description: Current membership info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /membership/subscribe:
    post:
      operationId: subscribeMembership
      tags: [membership]
      summary: Subscribe to a membership plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipSubscribeInput"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  /membership/cancel:
    post:
      operationId: cancelMembership
      tags: [membership]
      summary: Cancel the current membership
      responses:
        "200":
          description: Cancelled membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"

  # ─── Research Concierge ───────────────────────────────────────────────────────

  /concierge/paths:
    get:
      operationId: listConciergePaths
      security: []
      tags: [concierge]
      summary: List concierge researcher paths
      responses:
        "200":
          description: Available paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConciergePath"

  /concierge/recommend:
    post:
      operationId: getRecommendation
      tags: [concierge]
      summary: Get personalized path recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeRecommendInput"
      responses:
        "200":
          description: Recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeRecommendation"

  # ─── Translations ───────────────────────────────────────────────────────────

  /translations:
    get:
      operationId: getTranslation
      tags: [translations]
      summary: Read the signed-in researcher's translation workspace for a source
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Translation workspace record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
        "400":
          description: Missing or invalid sourceId
        "404":
          description: No workspace for this account and source
    post:
      operationId: createTranslation
      tags: [translations]
      summary: Create or return the signed-in researcher's workspace for a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTranslationInput"
      responses:
        "200":
          description: Existing workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"

  /translations/workspaces:
    get:
      operationId: listTranslationWorkspaces
      tags: [translations]
      summary: List the signed-in researcher's translation workspaces
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: List of workspace summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TranslationWorkspaceSummary"

  /translations/{id}:
    patch:
      operationId: updateTranslation
      tags: [translations]
      summary: Save one or more translation layers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationUpdateInput"
      responses:
        "200":
          description: Updated translation workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Translation"
        "404":
          description: Not found

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arc_session
      description: Server-side session id. The cookie is httpOnly, SameSite=Lax, and Secure in production.
  schemas:
    AuthUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        displayName: { type: string }
        role:
          type: string
          enum: [user, editor, admin]
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    CreateTranslationInput:
      type: object
      required: [sourceId]
      properties:
        sourceId: { type: integer, minimum: 1 }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Source ──────────────────────────────────────────────────────────────────

    Source:
      type: object
      required: [id, title, sourceType, collectionSlug, provenance, confidence, availability]
      properties:
        id: { type: number }
        title: { type: string }
        sourceType:
          type: string
          enum: [primary, translation, scholarship, interpretation, ai_assistance, conclusion]
        collectionSlug: { type: ["string", "null"] }
        collectionName: { type: ["string", "null"] }
        repository:
          oneOf:
            - $ref: "#/components/schemas/RepositorySummary"
            - type: "null"
        repositoryAccessStatus:
          type: ["string", "null"]
          enum: [digitized, catalog_only, restricted, physical_access_required, null]
        repositoryAccessNote: { type: ["string", "null"] }
